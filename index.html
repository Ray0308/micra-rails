<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b25"><title>マイクラレールズ — トロッコでにげろ！</title><link rel="stylesheet" href="style.css?v=20261105-bg"></head>
<body><main>
<header><a class="brand" href="./">▦ BLOCK PLAY LAB <span>PROTOTYPE 01</span></a><button id="sound" class="icon" aria-label="効果音を切り替える">音 OFF</button></header>
<section class="title"><p class="eyebrow">SLIDE / ESCAPE / BOOM!</p><h1 class="logo-title"><img src="assets/title-logo.jpg" alt="マイクラレールズ" width="1024" height="411"></h1><p>マイクラレールズ — レールをつないで、にげきれ。</p></section>
<section class="game"><div class="toolbar"><label>ステージ <select id="level"><option value="0">01 はじめの脱出</option><option value="1">02 道をとりもどせ</option><option value="2">03 まわり道</option></select></label><span id="moves">0 MOVES</span></div>
<div class="board-wrap"><div id="board" role="group" aria-label="道のスライドパズル"></div><div id="overlay" hidden><div id="result-icon"></div><h2 id="result-title"></h2><p id="result-text"></p><button id="again">もういちど</button></div></div>
<div class="status"><span id="lamp"></span><p id="message" role="status" aria-live="polite">空いているマスへ、レールをスライドしよう。</p></div>
<div class="actions"><button id="start" class="primary">▶ スタート</button><button id="pause">一時停止</button><button id="reset">↻ やりなおす</button></div>
<label class="pace">追いかける速さ <select id="pace"><option value="easy">ゆっくり</option><option value="normal">ふつう</option></select></label></section>
<section class="guide"><div><b>01 / つなぐ</b><p>空きマスのとなりをタップ、またはスワイプ。パネルは回転できない。</p></div><div><b>02 / 先をよむ</b><p>通ったレールは固定されて動かせない。十字だけは、別方向にもう一度通れる。</p></div><div><b>03 / にげる</b><p>クリーパーは足あとを追う。追いつかれる前に、右下の駅へ！</p></div></section>
<footer>個人用ファンゲーム試作 · キャラクターは仮表示 / 画像差し替え対応</footer>
</main><script type="module" src="app.mjs"></script></body></html>
