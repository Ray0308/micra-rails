<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24211e"><title>マイクラレールズ REN EDITION — トロッコでにげろ！</title><link rel="stylesheet" href="style.css?v=0.6.0"><meta name="application-name" content="マイクラレールズ"><meta name="apple-mobile-web-app-title" content="マイクラレールズ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" type="image/png" href="assets/app-icon.png?v=0.6.0"><link rel="apple-touch-icon" href="assets/app-icon.png?v=0.6.0"><link rel="manifest" href="manifest.webmanifest?v=0.6.0"></head>
<body data-screen="title" class="booting">
<section id="boot-screen" class="boot-screen" aria-label="Ray Edu Labo">
 <div class="boot-brand"><img src="assets/ray-edu-labo.png?v=0.5.3" alt="Ray Edu Labo" fetchpriority="high" decoding="async"></div>
 <p id="boot-status" class="sr-only" role="status">読み込み中</p>
</section>
<div class="version-badge" aria-label="バージョン 0.6.0">v0.6.0</div>
<section id="title-screen" class="menu-screen" aria-label="タイトル画面">
  <div class="title-logo"><h1><img src="assets/title-logo-transparent.png" alt="マイクラレールズ" width="1024" height="411"></h1><p class="title-edition">REN EDITION</p><span class="title-splash"><span>Moving by Minecart</span></span></div>
  <nav class="title-menu" aria-label="メインメニュー">
    <button id="play-game" class="mc-button">はじめる</button>
    <button id="open-guide" class="mc-button">図鑑</button>
    <div class="title-menu-bottom"><button id="open-options" class="mc-button">オプション</button><button id="open-credits" class="mc-button">クレジット</button></div>
  </nav>
  <p class="title-footer">マイクラレールズ </p>
</section>
<section id="world-screen" class="menu-screen world-screen" aria-labelledby="world-heading" hidden>
 <div class="world-panel">
  <h1 id="world-heading">ワールドを選ぶ</h1>
  <div class="world-choices" role="group" aria-label="ワールドを選んで開始">
   <button id="world-grass" class="world-choice choice-grass" aria-pressed="true"><span class="world-difficulty">難易度 1</span><span class="world-rate">キラ 5%</span><img class="world-symbol" src="assets/block-grass.jpg" alt="" width="300" height="300"><strong>草原</strong><span>2枚を入れ替え</span><small>停車で追跡もストップ</small></button>
   <button id="world-mine" class="world-choice choice-mine" aria-pressed="false"><span class="world-difficulty">難易度 2</span><span class="world-rate">キラ 8%</span><img class="world-symbol" src="assets/block-mine.jpg" alt="" width="300" height="300"><strong>廃坑</strong><span>タップで回転</span><small>地下のなかま出現UP</small></button>
   <button id="world-nether" class="world-choice choice-nether" aria-pressed="false"><span class="world-difficulty">難易度 3</span><span class="world-rate">キラ 12%</span><img class="world-symbol" src="assets/block-nether.jpg" alt="" width="300" height="300"><strong>ネザー</strong><span>次の線路を配置</span><small>ネザーのなかま出現UP</small></button>
   <button id="world-end" class="world-choice choice-end" aria-pressed="false"><span class="world-difficulty">難易度 4</span><span class="world-rate">キラ 18%</span><img class="world-symbol" src="assets/block-end.jpg" alt="" width="300" height="300"><strong>エンド</strong><span>空きマスへスライド</span><small>エンダー系の出現UP</small></button>
  </div>
  <button id="world-back" class="mc-button">戻る</button>
 </div>
</section>
<section id="guide-screen" class="collection-screen" aria-labelledby="catalog-heading" hidden>
  <div class="catalog-shell">
    <header class="catalog-header"><button id="catalog-back" class="hud-button" aria-label="戻る">◀</button><h1 id="catalog-heading">図鑑</h1><span id="catalog-summary" aria-live="polite"></span></header>
    <div id="catalog-tabs" role="tablist" aria-label="キャラクターのなかま"></div>
    <div id="catalog-grid" class="catalog-grid" role="tabpanel"></div>
    <nav id="catalog-pages" class="catalog-pages" aria-label="図鑑のページ"><button id="catalog-prev" aria-label="前のページ">◀</button><span id="catalog-page" aria-live="polite"></span><button id="catalog-next" aria-label="次のページ">▶</button></nav>
  </div>
  <dialog id="card-dialog" class="collection-dialog" aria-labelledby="detail-name"><button id="close-card" class="detail-close" aria-label="カードを閉じる">×</button><div id="detail-card" class="collectible-card"></div><div class="detail-copy"><h2 id="detail-name"></h2><p id="detail-count"></p><p id="detail-fact"></p><div class="card-variants"><button id="normal-card">ふつう</button><button id="shiny-card">✦ キラ</button></div><button id="read-card">♪ おはなしを聞く</button></div></dialog>
</section>
<section id="reward-screen" class="reward-screen" aria-labelledby="reward-headline" data-phase="mining" hidden>
  <button id="reward-title-back" class="hud-button reward-back" aria-label="タイトルへ戻る">◀</button>
  <h1 id="reward-headline">お宝を見つけた！</h1>
  <div class="mining-stage">
    <button id="mine-block" class="mine-block" aria-label="ブロックを掘る。あと5回">
      <span id="block-cube" class="block-cube" aria-hidden="true">
        <span class="mine-face face-front"><i class="ore-specks"></i><svg class="block-cracks" viewBox="0 0 100 100"></svg></span>
        <span class="mine-face face-side"><i class="ore-specks"></i><svg class="block-cracks" viewBox="0 0 100 100"></svg></span>
        <span class="mine-face face-top"><i class="ore-specks"></i><svg class="block-cracks" viewBox="0 0 100 100"></svg></span>
      </span>
    </button>
    <div id="block-fragments" aria-hidden="true"></div>
    <div id="reward-card" class="collectible-card" hidden></div>
  </div>
  <p id="mining-hint">タップで こわす</p>
  <div id="mining-progress" class="mining-progress" role="img" aria-label="5回のうち0回掘りました"></div>
  <p id="reward-status" class="reward-status" role="status" aria-live="polite"></p>
  <div id="reward-actions" class="reward-actions" hidden><button id="reward-next" class="mc-button">次の坑道へ</button><button id="reward-book">図鑑</button></div>
</section>
<p id="collection-save-warning" class="save-warning" role="status" hidden></p>
<section id="options-screen" class="menu-screen options-screen" aria-labelledby="options-heading" hidden>
  <div class="options-panel">
    <h1 id="options-heading">オプション</h1>
    <div class="option-row sound-option"><span id="sound-label">サウンド</span><div class="sound-switch" role="group" aria-labelledby="sound-label"><button id="sound-on" aria-pressed="false">ON</button><button id="sound-off" aria-pressed="true">OFF</button></div></div>
    <div class="option-row volume-option"><label for="bgm-volume">BGM</label><output id="bgm-value" for="bgm-volume">50</output><input id="bgm-volume" type="range" min="0" max="100" step="1" value="50"></div>
    <div class="option-row volume-option"><label for="sfx-volume">効果音</label><output id="sfx-value" for="sfx-volume">50</output><input id="sfx-volume" type="range" min="0" max="100" step="1" value="50"></div>
    <button id="options-done" class="mc-button">完了</button>
  </div>
</section>
<section id="credits-screen" class="menu-screen credits-screen" aria-labelledby="credits-heading" hidden>
 <div class="options-panel credits-panel">
  <h1 id="credits-heading">クレジット</h1>
  <dl class="credits-list">
   <div><dt>制作/原案</dt><dd>株式会社ムリなもんはムリ</dd></div>
   <div><dt>素材収集</dt><dd>パパ</dd></div>
   <div><dt>原画</dt><dd>Mojang</dd></div>
   <div><dt>テスト</dt><dd>山田</dd></div>
  </dl>
  <button id="credits-back" class="mc-button">タイトルに戻る</button>
 </div>
</section>
<main id="game-screen" hidden>
<div class="play-console">
<header class="game-hud">
  <button id="back-title" class="hud-button" aria-label="タイトルへ戻る"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 5L7 12L14 19M8 12H20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/></svg></button>
  <div class="stage-label"><span id="stage-number" aria-live="polite">草原 01</span><small id="world-rule">入れ替え</small></div>
  <button id="sound" class="hud-button" aria-label="サウンドをオンにする" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9H7L12 5V19L7 15H3Z" fill="currentColor"/><path d="M16 9L22 15M22 9L16 15" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
</header>
<section class="game" aria-label="レールパズル">
  <div class="board-wrap">
    <div id="board" role="group" aria-label="レールのスライドパズル"></div>
    <div id="actors" aria-hidden="true"><div id="actor-steve" class="actor actor-steve"></div><div id="actor-creeper" class="actor actor-creeper" hidden></div></div>
    <div id="overlay" role="alertdialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-text" hidden>
     <h2 id="result-title">YOUdead!</h2><p id="result-text">クリーパーに爆破された</p>
     <div class="death-actions"><button id="again" class="mc-button">リスポーン</button><button id="death-title" class="mc-button">タイトルに戻る</button><button id="death-change-map" class="mc-button">別のマップにする</button></div>
    </div>
  </div>
  <p id="message" class="sr-only" role="status" aria-live="polite"></p>
  <div class="control-dock">
  <div id="world-queue" class="world-queue" aria-label="次に出る線路" hidden><span>次の線路</span><div id="queue-pieces"></div></div>
  <div class="actions">
    <button id="start" class="primary"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5L19 12L8 19Z" fill="currentColor"/></svg><span>出発</span></button>
    <button id="pause" aria-label="一時停止"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5H10V19H6ZM14 5H18V19H14Z" fill="currentColor"/></svg></button>
    <button id="reset" aria-label="やりなおす"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 10A7 7 0 1 0 19 15M19 4V10H13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter"/></svg></button>
  </div>
  <div class="game-options"><span id="moves" aria-label="スライド回数">0 手</span></div>
  <div class="map-help"><button id="change-map">別のマップにする</button></div>
  </div>
</section>
</div>
</main><script type="module" src="app.mjs?v=0.6.0"></script></body></html>
